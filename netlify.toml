[build]
  publish = "."

[[redirects]]
  # Disable Pretty URLs: force extensionless requests to the .html version
  # This prevents Netlify from serving duplicate content at both /page and /page.html

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false
