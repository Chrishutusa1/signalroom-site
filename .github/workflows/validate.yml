# Publish-gate enforcement (GAPS.md #2). Runs the same checks the local
# publish flow relies on, so a merged episode page can never carry the
# recurring defect classes (meta >155, title >57, empty shorts alt, a
# missing or hasPart-carrying VideoObject), a mixed style.css?v=
# cache-bust, a stale sitemap, or a malformed _redirects line. The
# title/meta limits are enforced site-wide, not just on episodes.
# Every script called here is stdlib-only Python — no pip install.
name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guest review access tests
        run: |
          npm ci
          npm test

      - name: Episode publish gates (_validate_episode.py)
        run: |
          rc=0
          for f in episodes/*.html; do
            python _validate_episode.py "$f" || rc=1
          done
          exit $rc

      - name: Published episode count and current episode selection
        run: python -m unittest discover -s tests -p 'test_*.py'

      # The episode loop above only ever looked at episodes/*.html, so titles
      # and descriptions on root pages, topics/, watch/ and Articles/ were
      # never gated and 13 violations reached production. This covers every
      # page. app/ is excluded (noindex internal tool, outside the sitemap).
      - name: Site-wide title/description gates (_validate_meta.py)
        if: ${{ !cancelled() }}
        run: python _validate_meta.py

      # Every episode page MUST carry a VideoObject (its full-episode video
      # schema). These used to live on the retired /watch twins and were
      # migrated onto the /episodes hubs during the 2026-09 consolidation, so a
      # newly built episode page has no /watch to inherit from — the builder
      # must emit the VideoObject itself. This gate fails the first page that
      # ships without one. FAQPage coverage is reported as a notice only (not
      # every legacy episode has it yet).
      - name: Every episode page has a VideoObject
        if: ${{ !cancelled() }}
        run: |
          miss=""
          for f in episodes/*.html; do
            grep -Eq '"@type":[[:space:]]*"VideoObject"' "$f" || miss="$miss $f"
          done
          if [ -n "$miss" ]; then
            echo "::error::episode page(s) missing a VideoObject JSON-LD block (required — see CLAUDE.md episode anatomy):$miss"
            exit 1
          fi
          tot=$(ls episodes/*.html | wc -l)
          echo "VideoObject present on all $tot episode pages"
          faq=$(grep -lE '"@type":[[:space:]]*"FAQPage"' episodes/*.html | wc -l)
          echo "::notice::FAQPage present on $faq/$tot episode pages"

      # Google reads VideoObject.hasPart as key-moment Clips (startOffset + url
      # into the same video). Shorts are separate YouTube videos, so listing them
      # there raised "Structured data has Google rich results validation error"
      # on every page that had them (Ahrefs Site Audit, 2026-09-16). Shorts live
      # only in the visible reel, and a reel must never list the page's own full
      # episode video (8 pages did).
      - name: VideoObject has no hasPart; reels never list the page's own episode
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import glob, json, re, sys
          bad = []
          for f in sorted(glob.glob("episodes/*.html")):
              h = open(f, encoding="utf-8").read()
              for raw in re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S):
                  d = json.loads(raw)
                  if d.get("@type") != "VideoObject":
                      continue
                  if "hasPart" in d:
                      bad.append(f"{f}: VideoObject has hasPart")
                  m = re.search(r"embed/([\w-]{11})", d.get("embedUrl", ""))
                  reel = re.findall(r'class="episode-shorts-item[^"]*"[^>]*data-video-id="([\w-]{11})"', h)
                  if m and m.group(1) in reel:
                      bad.append(f"{f}: reel lists the page's own episode video {m.group(1)}")
          for b in bad:
              print(f"::error::{b}")
          print(f"checked {len(glob.glob('episodes/*.html'))} episode pages, {len(bad)} problem(s)")
          sys.exit(1 if bad else 0)
          PY

      # if: !cancelled() on the remaining checks so one failing gate doesn't
      # hide the others' results.
      - name: Shorts alt normalize is a no-op (dry-run)
        if: ${{ !cancelled() }}
        run: |
          out=$(python signalroom-publish-normalize.py --fix-alt)
          echo "$out"
          if echo "$out" | grep -q "WOULD FIX"; then
            echo "::error::signalroom-publish-normalize.py --fix-alt has pending fixes — run it with --apply and commit"
            exit 1
          fi

      - name: Single style.css cache-bust version
        if: ${{ !cancelled() }}
        run: |
          versions=$(grep -rho 'style.css?v=[^"]*' --include='*.html' . | sort -u)
          echo "$versions"
          if [ "$(echo "$versions" | wc -l)" -ne 1 ]; then
            echo "::error::multiple style.css?v= values live across pages — normalize to one (GAPS.md #4)"
            exit 1
          fi

      - name: sitemap.xml matches the pages on disk
        if: ${{ !cancelled() }}
        run: |
          # git history is needed for lastmod dates of new pages
          git fetch --unshallow --quiet 2>/dev/null || true
          python _generate_sitemap.py --check

      # The /episodes and /guests CollectionPage + ItemList JSON-LD is generated
      # from each hub's own cards (_generate_hub_schema.py), so it cannot drift
      # unless a card is added or removed without regenerating. This reports that
      # as a WARNING only and never fails the build, so adding an episode is not
      # blocked on this step. A broken card layout (script cannot parse it) also
      # surfaces here as a warning.
      - name: Hub ItemList schema matches the hub cards (warning only)
        if: ${{ !cancelled() }}
        run: |
          python _generate_hub_schema.py --check || echo "::warning::episodes/guests hub ItemList schema is out of date or unreadable: run 'python _generate_hub_schema.py --apply' and commit"

      # GA4 loader contract. On 2026-10-21 the deferred loader (idle callback,
      # up to 4s, page_view as a cancellable fetch) was linked to GA4 sessions
      # with landing page (not set): 26 of 595 sessions in the prior 30 days,
      # every one with session_start + user_engagement and no page_view. Every
      # page that carries the tag must use the beacon transport and start the
      # load on the window load event, keep the production-hostname gate, and
      # must not fall back to requestIdleCallback. Pages built outside this repo
      # (the claude.ai episode builder) will fail here until their template is
      # updated, which is the point of the gate.
      - name: GA4 loader uses beacon transport and the load event
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import pathlib, sys
          TAG = "G-RZNHLJSRW3"
          bad = []
          n = 0
          for p in sorted(pathlib.Path(".").rglob("*.html")):
              if "node_modules" in p.parts or ".git" in p.parts:
                  continue
              h = p.read_text(encoding="utf-8")
              if TAG not in h:
                  continue
              n += 1
              if "transport_type: 'beacon'" not in h:
                  bad.append(f"{p}: gtag config lacks transport_type: 'beacon'")
              if "window.addEventListener('load'" not in h and "document.readyState === 'complete'" not in h:
                  bad.append(f"{p}: loader does not start on the window load event")
              if "requestIdleCallback(loadGA" in h:
                  bad.append(f"{p}: loader still waits on requestIdleCallback")
              if 'location.hostname !== "signalroompodcast.com"' not in h:
                  bad.append(f"{p}: production-hostname gate missing")
          for b in bad:
              print(f"::error::{b}")
          print(f"checked {n} pages carrying {TAG}, {len(bad)} problem(s)")
          sys.exit(1 if bad else 0)
          PY

      - name: _redirects line shape
        if: ${{ !cancelled() }}
        run: |
          # Every non-comment, non-blank line must be: pattern  target  status
          # where status is 200, 301, 301!, 404 or 404! (the 404! rules keep
          # repo docs off the served site — see the block in _redirects).
          bad=$(grep -vE '^\s*(#|$)' _redirects | grep -vE '^\S+\s+\S+\s+(200|301!?|404!?)\s*$' || true)
          if [ -n "$bad" ]; then
            echo "::error::malformed _redirects line(s):"
            echo "$bad"
            exit 1
          fi
          echo "_redirects OK"
